name: Release Go client

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Go client version, e.g. v0.2.0"
        required: true
        type: string
      dry_run:
        description: "Validate release without pushing to mirror"
        required: true
        default: true
        type: boolean
      create_release:
        description: "Create a GitHub Release in the mirror repository"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      MIRROR_REPO: NikolayS/pgque-go
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache-dependency-path: clients/go/go.sum

      - name: Audit Go dependency graph
        working-directory: clients/go
        run: |
          set -Eeuo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          # Do not use JSON mode as an exit-status findings gate.
          govulncheck -scan=module
          go mod verify

      - name: Validate version and tests
        run: |
          set -Eeuo pipefail
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "version must look like v0.2.0 or v0.3.0-rc.2"
            exit 1
          fi
          git check-ref-format "refs/tags/$VERSION"
          cd clients/go
          go test ./...

      - name: Split clients/go subtree
        run: |
          set -Eeuo pipefail
          split_sha=$(git subtree split --prefix=clients/go HEAD)
          echo "split_sha=$split_sha" >> "$GITHUB_ENV"
          echo "mirror commit: $split_sha"

      - name: Check public mirror tag does not exist
        if: ${{ !inputs.dry_run }}
        run: |
          set -Eeuo pipefail
          remote="https://github.com/${MIRROR_REPO}.git"
          if git ls-remote --exit-code --tags "$remote" "refs/tags/$VERSION" >/dev/null; then
            echo "mirror tag $VERSION already exists"
            exit 1
          else
            rc=$?
            if [ "$rc" -ne 2 ]; then
              echo "failed to check mirror tag $VERSION"
              exit "$rc"
            fi
          fi

      - name: Validate mirror-root tree
        run: |
          set -Eeuo pipefail
          tmp=$(mktemp -d)
          git worktree add --detach "$tmp" "$split_sha"
          trap 'git worktree remove --force "$tmp"' EXIT
          cd "$tmp"
          test "$(go list -m)" = "github.com/NikolayS/pgque-go"
          go list ./...
          go test ./...

      - name: Show mirror update dry run
        if: inputs.dry_run
        run: |
          set -Eeuo pipefail
          echo "dry run: would push subtree $split_sha to ${MIRROR_REPO}:main and tag $VERSION"

  publish:
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    environment: go-release
    env:
      VERSION: ${{ inputs.version }}
      MIRROR_REPO: NikolayS/pgque-go
      GH_TOKEN: ${{ secrets.PGQUE_GO_MIRROR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache-dependency-path: clients/go/go.sum

      - name: Verify mirror token principal
        env:
          EXPECTED_LOGIN: NikolayS
        run: |
          set -Eeuo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PGQUE_GO_MIRROR_TOKEN is empty or unavailable"
            exit 1
          fi
          login=$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user | jq -r .login)
          if [ "$login" != "$EXPECTED_LOGIN" ]; then
            echo "PGQUE_GO_MIRROR_TOKEN resolves to '$login', expected '$EXPECTED_LOGIN'"
            exit 1
          fi

      - name: Split clients/go subtree
        run: |
          set -Eeuo pipefail
          split_sha=$(git subtree split --prefix=clients/go HEAD)
          echo "split_sha=$split_sha" >> "$GITHUB_ENV"
          echo "mirror commit: $split_sha"

      - name: Push mirror main and tag
        run: |
          set -Eeuo pipefail
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          remote="https://github.com/${MIRROR_REPO}.git"
          if git -c "http.https://github.com/.extraheader=${auth_header}" ls-remote --exit-code --tags "$remote" "refs/tags/$VERSION" >/dev/null; then
            echo "mirror tag $VERSION already exists"
            exit 1
          else
            rc=$?
            if [ "$rc" -ne 2 ]; then
              echo "failed to check mirror tag $VERSION"
              exit "$rc"
            fi
          fi

          # Push main first so a failed non-fast-forward push never leaves an
          # immutable tag dangling on the mirror.
          git -c "http.https://github.com/.extraheader=${auth_header}" push "$remote" "$split_sha:refs/heads/main"

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          git -c "http.https://github.com/.extraheader=${auth_header}" clone --no-checkout --filter=blob:none "$remote" "$tmp"
          git -C "$tmp" config user.name "github-actions[bot]"
          git -C "$tmp" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tmp" -c "http.https://github.com/.extraheader=${auth_header}" fetch origin main
          git -C "$tmp" tag -a "$VERSION" "$split_sha" -m "Go client $VERSION"
          git -C "$tmp" -c "http.https://github.com/.extraheader=${auth_header}" push origin "refs/tags/$VERSION"

      - name: Create GitHub Release in mirror
        if: inputs.create_release
        run: |
          set -Eeuo pipefail
          release_args=(
            --repo "$MIRROR_REPO"
            --title "Go client $VERSION"
            --notes "Go client release for module github.com/NikolayS/pgque-go. Install with: go get github.com/NikolayS/pgque-go@$VERSION"
          )
          if [[ "$VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$VERSION" "${release_args[@]}"

      - name: Warm Go module proxy cache
        run: |
          set -Eeuo pipefail
          curl -fsSL "https://proxy.golang.org/github.com/!nikolay!s/pgque-go/@v/$VERSION.info" >/dev/null || true

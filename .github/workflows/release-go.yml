name: Release Go client

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Go client version, e.g. v0.2.0"
        required: true
        type: string
      dry_run:
        description: "Validate release without pushing to mirror"
        required: true
        default: true
        type: boolean
      create_release:
        description: "Create a GitHub Release in the mirror repository"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/maintenance-0-2'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      MIRROR_REPO: NikolayS/pgque-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: clients/go/go.mod
          cache-dependency-path: clients/go/go.sum

      - name: Test atomic mirror publication
        run: bash tests/test_go_release.sh

      - name: Validate version and tests
        run: |
          set -Eeuo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must look like v0.2.0"
            exit 1
          fi
          cd clients/go
          go test ./...

      - name: Split clients/go subtree
        run: |
          set -Eeuo pipefail
          split_sha=$(git subtree split --prefix=clients/go HEAD)
          echo "split_sha=$split_sha" >> "$GITHUB_ENV"
          echo "mirror commit: $split_sha"

      - name: Check public mirror tag does not exist
        run: |
          set -Eeuo pipefail
          remote="https://github.com/${MIRROR_REPO}.git"
          if git ls-remote --exit-code --tags "$remote" "refs/tags/$VERSION" >/dev/null; then
            echo "mirror tag $VERSION already exists"
            exit 1
          else
            rc=$?
            if [ "$rc" -ne 2 ]; then
              echo "failed to check mirror tag $VERSION"
              exit "$rc"
            fi
          fi

      - name: Validate mirror-root tree
        run: |
          set -Eeuo pipefail
          tmp=$(mktemp -d)
          git worktree add --detach "$tmp" "$split_sha"
          trap 'git worktree remove --force "$tmp"' EXIT
          cd "$tmp"
          test "$(go list -m)" = "github.com/NikolayS/pgque-go"
          go list ./...
          go test ./...

      - name: Show mirror update dry run
        if: inputs.dry_run
        run: |
          set -Eeuo pipefail
          echo "dry run: would push subtree $split_sha to ${MIRROR_REPO}:main and tag $VERSION"

  publish:
    if: ${{ !inputs.dry_run }}
    needs: validate
    runs-on: ubuntu-latest
    environment: go-release
    env:
      VERSION: ${{ inputs.version }}
      MIRROR_REPO: NikolayS/pgque-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: clients/go/go.mod
          cache-dependency-path: clients/go/go.sum

      - name: Verify mirror token principal
        env:
          GH_TOKEN: ${{ secrets.PGQUE_GO_MIRROR_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PGQUE_GO_MIRROR_TOKEN is empty or unavailable"
            exit 1
          fi
          EXPECTED_LOGIN="${MIRROR_REPO%%/*}"
          login=$(gh api user --jq .login)
          if [ "$login" != "$EXPECTED_LOGIN" ]; then
            echo "PGQUE_GO_MIRROR_TOKEN resolves to '$login', expected '$EXPECTED_LOGIN'"
            exit 1
          fi

          gh api "repos/$MIRROR_REPO" --jq '.permissions.push' | grep -qx true

      - name: Split clients/go subtree
        run: |
          set -Eeuo pipefail
          split_sha=$(git subtree split --prefix=clients/go HEAD)
          echo "split_sha=$split_sha" >> "$GITHUB_ENV"
          echo "mirror commit: $split_sha"

      - name: Push mirror main and tag
        env:
          GH_TOKEN: ${{ secrets.PGQUE_GO_MIRROR_TOKEN }}
        run: |
          set -Eeuo pipefail
          remote="https://github.com/${MIRROR_REPO}.git"
          mirror_git() {
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' "$@"
          }
          if mirror_git ls-remote --exit-code --tags "$remote" "refs/tags/$VERSION" >/dev/null; then
            echo "mirror tag $VERSION already exists"
            exit 1
          else
            rc=$?
            if [ "$rc" -ne 2 ]; then
              echo "failed to check mirror tag $VERSION"
              exit "$rc"
            fi
          fi

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mirror_git clone --no-checkout --filter=blob:none "$remote" "$tmp"
          git -C "$tmp" config user.name "github-actions[bot]"
          git -C "$tmp" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tmp" fetch "$GITHUB_WORKSPACE" "$split_sha"
          git -C "$tmp" merge-base --is-ancestor origin/main "$split_sha" || {
            echo "release subtree does not fast-forward mirror main; no refs were published"
            exit 1
          }
          git -C "$tmp" tag -a "$VERSION" "$split_sha" -m "Go client $VERSION"
          mirror_git -C "$tmp" push --atomic origin \
            "$split_sha:refs/heads/main" "refs/tags/$VERSION"

      - name: Create GitHub Release in mirror
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.PGQUE_GO_MIRROR_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release create "$VERSION" \
            --repo "$MIRROR_REPO" \
            --target "$split_sha" \
            --title "Go client $VERSION" \
            --notes "Go client release for module github.com/NikolayS/pgque-go. Install with: go get github.com/NikolayS/pgque-go@$VERSION"

      - name: Warm Go module proxy cache
        run: |
          set -Eeuo pipefail
          curl -fsSL "https://proxy.golang.org/github.com/!nikolay!s/pgque-go/@v/$VERSION.info" >/dev/null || true
